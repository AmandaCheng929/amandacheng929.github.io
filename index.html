<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio of work in human-computer interaction, human-robot interaction, game design, prototyping and art.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <a class="skip" href="#work">Skip to projects</a>

  <header class="topbar">
    <a class="brand" href="index.html" data-name></a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#" data-cv target="_blank" rel="noopener">CV</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 class="statement" data-statement></h1>
      <p class="intro" data-intro></p>
    </section>

    <section id="work" class="work-section" aria-labelledby="work-heading">
      <div class="work-head">
        <h2 id="work-heading">Selected work</h2>
        <div class="filters" role="group" aria-label="Filter projects" data-filters></div>
      </div>
      <ul class="grid" data-grid></ul>
    </section>

    <section id="about" class="about" aria-labelledby="about-heading">
      <h2 id="about-heading">About</h2>
      <div class="about-body">
        <img class="portrait" data-photo src="" alt="">
        <div>
          <div class="prose" data-about></div>
          <h3>Research interests</h3>
          <ul class="interests" data-interests></ul>
          <div class="skills" data-skills></div>
          <p><a class="btn" href="#" data-cv target="_blank" rel="noopener">Download CV (PDF)</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <h2>Get in touch</h2>
    <p class="contact" data-contact></p>
    <p class="fine">&copy; <span data-year></span> <span data-name></span></p>
  </footer>

  <script src="assets/js/projects.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
